name: CI

# Mirrors lefthook.yml's pre-push gate: format-check, lint, lockfile, test,
# typecheck — same order, same commands, run through `uv run --locked` so a
# drifted uv.lock fails loudly instead of silently diverging from what
# contributors run locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
        # No python-version input: setup-uv reads .python-version from the
        # working directory automatically. Pinning it here was an invalid
        # input carried over from actions/setup-python — GitHub Actions
        # ignored it silently rather than failing the run.

      - run: uv sync --locked

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Lockfile check
        run: uv lock --check

      - name: Test
        run: uv run --locked pytest

      - name: Typecheck
        run: uv run --locked mypy src
