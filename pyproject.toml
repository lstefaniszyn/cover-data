[project]
name = "cover-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukasz Stefaniszyn", email = "stefaniszynlukasz@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle>=3.3.1",
    "typer>=0.27.1",
]

[project.scripts]
cover-data = "cover_data:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Register the marker lefthook's pre-commit job filters on (`-m "not slow"`).
markers = ["slow: fixture-heavy OCR or full-page redaction test"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
# Lint this project's code only. The repo carries vendored agent tooling with
# its own Python scripts (.github/skills/**) that we neither own nor style.
extend-exclude = [".agents", ".claude", ".codex", ".github"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
